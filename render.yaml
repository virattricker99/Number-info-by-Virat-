services:
  - type: web
    runtime: python
    name: virat-number-info
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 30 "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: virat-number-info-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LOOKUP_AUDIT_PEPPER
        generateValue: true
      - key: DEFAULT_COUNTRY
        value: IN
      - key: RATE_LIMIT
        value: 10 per minute
      - key: BATCH_RATE_LIMIT
        value: 3 per minute
      - key: MAX_BATCH_SIZE
        value: "15"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: VERIPHONE_API_KEY
        sync: false

databases:
  - name: virat-number-info-db
    plan: free
    databaseName: numberinfo
    user: numberinfo
